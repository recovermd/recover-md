name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    # Watcher, path and restore behaviour differ per platform, so the suite runs on each
    # (§25 "platform testing"). Linux is included as a fast smoke run for the pure logic.
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # node:sqlite is required by the storage layer.
          node-version: '24'
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      - run: npm run lint

      - run: npm test

      - run: npm run build:app
